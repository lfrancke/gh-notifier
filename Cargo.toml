[package]
name = "gh-notifier"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Desktop notifier for GitHub notifications on Linux (D-Bus)"
license = "Apache-2.0"
repository = "https://github.com/lfrancke/gh-notifier"
authors = ["Lars Francke"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
cap-directories = "4.0"
cap-primitives = "4.0"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4.17"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
